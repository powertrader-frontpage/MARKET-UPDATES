name: Python syntax check

on:
  push:
    branches:
      - phase1-fyers-main-dashboard-data
      - phase1-canonical-microsector-preview
      - mobile-navigation-refactor
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile dashboard and scanner modules
        run: |
          python -m py_compile app.py nse500_screener.py canonical_microsector.py canonical_microsector_runtime.py canonical_microsectors.py classification_master.py price_symbol_aliases.py explosive_breakout_scanner.py historical_breakout_postmortem.py b1_fundamental_screener.py
          python scripts/test_canonical_microsector_runtime.py
          python scripts/test_price_symbol_aliases.py
          python scripts/test_canonical_dashboard_microsector.py
