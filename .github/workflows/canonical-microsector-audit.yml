name: Canonical microsector audit

on:
  push:
    branches:
      - phase1-fyers-main-dashboard-data
    paths:
      - "app.py"
      - "classification_master.py"
      - "canonical_microsectors.py"
      - "data/stock_classification_master.csv"
      - "data/microsector_canonical_alias_map.csv"
      - "scripts/audit_canonical_microsectors.py"
      - ".github/workflows/canonical-microsector-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: phase1-fyers-main-dashboard-data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Compile canonical modules
        run: python -m py_compile classification_master.py canonical_microsectors.py scripts/audit_canonical_microsectors.py
      - name: Run read-only migration audit
        run: python scripts/audit_canonical_microsectors.py
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: canonical-microsector-audit
          path: |
            reports/canonical_microsector_migration_audit.md
            reports/microsector_legacy_vs_canonical_membership.csv
