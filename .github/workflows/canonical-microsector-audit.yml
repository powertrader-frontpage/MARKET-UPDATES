name: Canonical microsector audit

on:
  push:
    branches:
      - phase1-fyers-main-dashboard-data
    paths:
      - "app.py"
      - "classification_master.py"
      - "canonical_microsectors.py"
      - "data/stock_classification_master.csv"
      - "data/microsector_canonical_alias_map.csv"
      - "scripts/audit_canonical_microsectors.py"
      - "scripts/build_canonical_microsector_shadow.py"
      - "scripts/build_microsector_per_consumer_shadow.py"
      - "scripts/audit_sector_hierarchy_completeness.py"
      - ".github/workflows/canonical-microsector-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: phase1-fyers-main-dashboard-data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Compile canonical modules
        run: python -m py_compile classification_master.py canonical_microsectors.py scripts/audit_canonical_microsectors.py scripts/build_canonical_microsector_shadow.py scripts/build_microsector_per_consumer_shadow.py scripts/audit_sector_hierarchy_completeness.py
      - name: Run read-only migration audit
        run: python scripts/audit_canonical_microsectors.py
      - name: Build canonical baskets in shadow mode
        run: python scripts/build_canonical_microsector_shadow.py
      - name: Build per-consumer membership diffs
        run: python scripts/build_microsector_per_consumer_shadow.py
      - name: Audit sector hierarchy completeness
        run: python scripts/audit_sector_hierarchy_completeness.py
      - name: Upload audit and shadow outputs
        uses: actions/upload-artifact@v4
        with:
          name: canonical-microsector-audit
          path: |
            reports/canonical_microsector_migration_audit.md
            reports/microsector_legacy_vs_canonical_membership.csv
            reports/canonical_microsector_shadow_baskets.csv
            reports/canonical_microsector_shadow_summary.md
            reports/microsector_per_consumer_membership_diff.csv
            reports/microsector_per_consumer_shadow_summary.md
            reports/sector_hierarchy_completeness_audit.md
            reports/sector_hierarchy_missing_values.csv
