name: Market Dashboard Morning Screenshot

on:
  schedule:
    # 07:00 Asia/Kolkata = 01:30 UTC, Monday-Friday.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-dashboard-screenshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install screenshot and exchange-calendar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright exchange-calendars pandas
          python -m playwright install --with-deps chromium

      - name: Capture dashboard if NSE is open
        env:
          DASHBOARD_URL: https://market-updates-5tqz2bgy4eyofrpfj8t6rt.streamlit.app/
        run: python scripts/capture_dashboard.py

      - name: Upload screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: market-dashboard-${{ github.run_id }}
          path: output/market-dashboard.png
          if-no-files-found: ignore
          retention-days: 14
